<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Ensure window.fetch has a setter so extensions/test runners don't crash with "Cannot set property fetch which has only a getter"
      (function() {
        try {
          var realFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var _fetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            }
          });
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return _fetch;
                },
                set: function(val) {
                  _fetch = val;
                }
              });
            } catch (err) {}
          }
        } catch (e) {}
      })();
    </script>
